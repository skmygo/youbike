[project]
name = "youbike"
version = "0.1.0"
description = "YouBike 智慧調度平台（新北市政府 AI 黑客松・交通局命題）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "duckdb>=1.1",
    "pyarrow>=18",
    "pandas>=2.2",
    "numpy>=2.0",
    "requests>=2.32",
    "boto3>=1.35",
]

[project.optional-dependencies]
pipeline = [
    "dagster>=1.9",
    "dagster-webserver>=1.9",
]
ml = [
    "lightgbm>=4.5",
    "scikit-learn>=1.5",
    "mlflow>=2.17",
    "matplotlib>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "pipeline", "ml"]
